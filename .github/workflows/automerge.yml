name: Dependabot reviewer

# Fires whenever Dependabot opens, updates, or reopens a PR targeting main.
# pull_request_target runs in the context of the base branch, which gives the
# GITHUB_TOKEN enough permission to merge or close without extra secrets.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: ["main"]

# One run per PR at a time. We let the current run finish so an in-progress
# squash merge isn't interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Minimum permissions needed:
# - pull-requests: close and comment on PRs
# - contents: enable auto-merge (writes to the merge queue)
permissions:
  pull-requests: write
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review-dependabot-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip entirely if this PR wasn't opened by Dependabot.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      # Allow: github_actions updates at any version (this includes Dependabot's
      # own actions such as dependabot/fetch-metadata), or an explicit
      # semver-patch / semver-minor update in any other ecosystem.
      # Deny: everything else -- majors, and any PR whose update-type is
      # missing, empty, or "null" (fail closed if metadata can't be parsed).
      - name: Decide
        id: decision
        env:
          ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}
          update_type: ${{ steps.metadata.outputs.update-type }}
        run: |
          if [[ "$ecosystem" == "github_actions" ]] || \
             [[ "$update_type" == "version-update:semver-patch" ]] || \
             [[ "$update_type" == "version-update:semver-minor" ]]; then
            echo "action=allow" >> "$GITHUB_OUTPUT"
          else
            echo "action=deny" >> "$GITHUB_OUTPUT"
          fi

      # --auto queues the merge so all required branch protection checks must
      # pass first before the merge goes through.
      - name: Allow — merge
        if: steps.decision.outputs.action == 'allow'
        run: |
          gh pr merge "$PR_URL" --squash --auto

      - name: Deny — unexpected update
        if: steps.decision.outputs.action == 'deny'
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-major)
              reason="this is a major version bump. Only github_actions updates may auto-merge a major; upgrade this dependency manually." ;;
            ""|null)
              reason="Dependabot metadata did not report an update-type, so the bump size could not be verified. Failing closed; review and upgrade manually." ;;
            *)
              reason="update-type \`$UPDATE_TYPE\` is not on the allow-list (only semver-patch and semver-minor auto-merge)." ;;
          esac
          gh pr close "$PR_URL" --comment "Auto-closed (ecosystem \`${ECOSYSTEM:-<missing>}\`, update-type \`${UPDATE_TYPE:-<missing>}\`): $reason"
